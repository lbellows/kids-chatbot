# Build the image and publish it to GitHub Container Registry.
#
# The server never builds from source — it pulls the image this job produces.
# Every push to `main` republishes `:latest`, so updating a deployment is
# `docker compose pull && docker compose up -d`.
name: Build and publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          # amd64 only — the server is x86. Adding linux/arm64 back means
          # re-adding the QEMU setup step above; the image itself is
          # arch-agnostic (better-sqlite3 ships prebuilds for both).
          platforms: linux/amd64
          push: true
          # `:latest` is what deployments track; the SHA tag gives you an exact
          # image to pin or roll back to if a release misbehaves.
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
