<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparky — your friendly helper</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<!-- Preloaded so the fonts fetch in parallel with the stylesheet rather than
     after it is parsed. See docs/fonts.md. -->
<link rel="preload" href="/fonts/Nunito-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/NotoColorEmoji-COLRv1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Name prompt. Shown on first visit; the name is remembered in this browser
     and scopes the history sidebar. -->
<div class="overlay" id="namePicker" hidden>
  <div class="picker-card">
    <div class="picker-spark">✨</div>
    <h1>Hi! I'm Sparky.</h1>
    <p>What's your name?</p>
    <form class="name-form" id="nameForm">
      <label class="sr-only" for="nameInput">Your name</label>
      <input id="nameInput" type="text" maxlength="24" autocomplete="off"
             autocapitalize="words" spellcheck="false"
             placeholder="Type your name…" required>
      <button type="submit">Let's go! →</button>
    </form>
    <p class="picker-hint" id="nameHint" hidden></p>
  </div>
</div>

<div class="app" id="app" hidden>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <button class="new-chat" id="newChat">
        <span aria-hidden="true">✏️</span> New chat
      </button>
      <button class="icon-btn close-sidebar" id="closeSidebar" aria-label="Close menu">✕</button>
    </div>

    <div class="history-label">Your chats</div>
    <nav class="history" id="history"></nav>

    <div class="sidebar-foot">
      <!-- Inline SVG rather than an emoji: this label is written during boot,
           and an emoji there paints before the emoji font is ready. See the
           note in app.js and docs/fonts.md. -->
      <button class="whoami" id="whoami" title="Not you? Tap to switch.">
        <svg class="whoami-icon" viewBox="0 0 24 24" aria-hidden="true"
             fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span class="whoami-name" id="whoamiName"></span>
      </button>
    </div>
  </aside>

  <div class="scrim" id="scrim" hidden></div>

  <main class="chat">
    <header class="chat-head">
      <button class="icon-btn open-sidebar" id="openSidebar" aria-label="Open menu">☰</button>
      <div class="chat-title">
        <span class="spark" aria-hidden="true">⭐</span>
        <h2 id="chatTitle">Sparky</h2>
      </div>
      <button class="icon-btn new-chat-mobile" id="newChatMobile" aria-label="New chat">✏️</button>
    </header>

    <div class="messages" id="messages"></div>

    <button class="scroll-down" id="scrollDown" aria-label="Go to newest" hidden>↓</button>

    <!-- Emoji palette. A phone keyboard already has an emoji key; a desktop
         keyboard mostly doesn't, so this is how a kid on a PC adds one. -->
    <div class="emoji-panel" id="emojiPanel" hidden></div>

    <form class="composer" id="composer">
      <button type="button" class="emoji-btn" id="emojiBtn"
              aria-label="Add an emoji" aria-expanded="false" title="Add an emoji">🙂</button>
      <textarea id="input" rows="1" maxlength="1000"
                placeholder="Ask me anything…"
                autocomplete="off" spellcheck="true"></textarea>
      <button type="submit" id="send" aria-label="Send">➤</button>
    </form>
    <p class="disclaimer">Sparky is a computer helper and can make mistakes. Ask a grown-up about anything important.</p>
  </main>

</div>

<script src="/app.js"></script>
</body>
</html>
